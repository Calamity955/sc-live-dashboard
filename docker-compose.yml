services:
  sc-dashboard:
    build: .
    image: sc-dashboard:latest
    container_name: sc-dashboard
    restart: unless-stopped

    # Bind SOLO sull'IP Tailscale -> dashboard accessibile solo via Tailscale,
    # mai esposta sull'IP pubblico né su 0.0.0.0 LAN.
    ports:
      - "100.98.10.55:8765:8765"

    env_file:
      - .env.prod

    volumes:
      # DB SQLite + eventi persistenti tra restart
      - ./data:/app/data
      # Mock CSV "current.csv" usato fino a quando SFTP non è attivo
      - ./data/csv:/app/data/csv

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; urllib.request.urlopen(\"http://localhost:8765/api/status\", timeout=3); sys.exit(0)' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
